<script>
        // Micro-interaction for inputs
        document.querySelectorAll('input, select, textarea').forEach(el => {
            el.addEventListener('focus', () => {
                el.parentElement.querySelector('label').classList.replace('text-secondary', 'text-velocity-orange');
            });
            el.addEventListener('blur', () => {
                el.parentElement.querySelector('label').classList.replace('text-velocity-orange', 'text-secondary');
            });
        });

        // Simple Toggle interaction for visual feedback
        const toggle = document.querySelector('input[type="checkbox"]');
        toggle.addEventListener('change', (e) => {
            const label = e.target.nextElementSibling.nextElementSibling;
            label.textContent = e.target.checked ? 'Active' : 'Inactive';
        });
    </script>
